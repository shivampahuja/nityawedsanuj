<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nitya weds Anuj · Photo wall</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<style>
__FONTS__
</style>
<style>
  /* The wall is the photographs. A slow river of every picture shared so far, drifting upward in columns;
     one picture at a time comes forward, then settles back. Names, count and the QR sit quietly along the bottom.
     Colour: night #120504 and cream #fbefd9, one gold hairline. Type: Imperial Script for the names, Cormorant Garamond for the rest. */
  :root{ --night:#120504; --cream:#fbefd9; --muted:#d9bc8f; --gold:#e3c08a; --gap:.6vmin;
         --script:'Imperial Script',cursive; --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--night);color:var(--cream);font-family:var(--serif)}

  .river{position:absolute;inset:0;display:flex;gap:var(--gap);padding:0 var(--gap);overflow:hidden}
  .col{position:relative;flex:1 1 0;min-width:0;will-change:transform}
  .tile{position:absolute;left:0;right:0;background:#1d0c08;overflow:visible}
  .tile img{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s ease}
  .tile img.in{opacity:1}
  .tile .box{position:absolute;inset:0;overflow:hidden;transform-origin:center;transition:transform 1.6s cubic-bezier(.2,.8,.2,1),box-shadow 1.6s ease}
  .tile.lens{z-index:20}
  .tile.fresh .box::after{content:"";position:absolute;left:0;right:0;bottom:0;height:.45vmin;background:var(--gold)}
  .tile .play{position:absolute;right:1.2vmin;bottom:1.2vmin;width:3.2vmin;height:3.2vmin;border-radius:50%;background:rgba(18,5,4,.55);display:none;align-items:center;justify-content:center;pointer-events:none}
  .tile .play::after{content:"";margin-left:.35vmin;border-left:1.2vmin solid rgba(251,239,217,.95);border-top:.7vmin solid transparent;border-bottom:.7vmin solid transparent}
  .tile.video .play{display:flex}
  .just{position:absolute;left:0;right:0;bottom:0;padding:2.4vmin 1vmin .9vmin;text-align:center;font-style:italic;font-size:1.25vmin;color:var(--cream);background:linear-gradient(180deg,rgba(18,5,4,0),rgba(18,5,4,.7));opacity:0;transition:opacity .8s}
  .tile.lens.fresh .just{opacity:1}

  .veil{position:absolute;z-index:40;left:0;right:0;bottom:0;height:30vmin;background:linear-gradient(180deg,rgba(18,5,4,0) 0%,rgba(18,5,4,.72) 60%,rgba(18,5,4,.9) 100%);pointer-events:none}
  footer{position:absolute;z-index:41;left:0;right:0;bottom:0;display:flex;align-items:flex-end;justify-content:space-between;gap:4vmin;padding:0 4vmin 3.2vmin}
  .names{font-family:var(--script);font-size:9vmin;line-height:.9;text-shadow:0 2px 16px rgba(0,0,0,.6)}
  .count{margin-top:1.2vmin;font-style:italic;font-size:2.9vmin;color:var(--muted)}
  .scan{display:flex;align-items:center;gap:2.4vmin;text-align:left}
  .scan svg{width:15vmin;height:15vmin;background:#fff;padding:1vmin;display:block;flex:none}
  .scan svg path{fill:#120504}
  .scan p{font-size:3vmin;line-height:1.2;max-width:14em;text-wrap:balance}
  .scan p small{display:block;margin-top:.8vmin;font-style:italic;font-size:2.3vmin;color:var(--muted)}

  /* before the first photo */
  .empty{position:absolute;z-index:42;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vmin;text-align:center;padding:6vmin;opacity:0;pointer-events:none;transition:opacity 1.2s}
  .empty.show{opacity:1}
  .empty .big{font-family:var(--script);font-size:16vmin;line-height:1}
  .empty .line{font-style:italic;font-size:4vmin;color:var(--muted);max-width:28em;text-wrap:balance}
  .empty svg{width:26vmin;height:26vmin;background:#fff;padding:1.6vmin;margin-top:2vmin}
  .empty svg path{fill:#120504}
  body.empty-state footer{visibility:hidden}

  .hint{position:absolute;z-index:43;left:50%;top:2vmin;transform:translateX(-50%);font-style:italic;font-size:2.2vmin;color:var(--muted);opacity:.8;transition:opacity .8s;pointer-events:none}
  .hint.gone{opacity:0}

  @media (orientation:portrait){
    footer{flex-direction:column;align-items:flex-start;gap:3vmin}
    .names{font-size:11vmin}
  }
  @media (prefers-reduced-motion:reduce){ .tile .box{transition:none} }
</style>
</head>
<body class="empty-state">
<div class="river" id="river" aria-hidden="true"></div>
<div class="veil"></div>
<div class="empty show" id="empty">
  <div class="big">Nitya &amp; Anuj</div>
  <div class="line" id="emptyLine">The first photos from the celebrations will appear here.</div>
  __QR_SVG__
  <div class="line" style="font-size:3vmin">Scan to add your photos and videos</div>
</div>
<footer>
  <div>
    <div class="names">Nitya &amp; Anuj</div>
    <div class="count" id="count">Waiting for the first photo</div>
  </div>
  <div class="scan">
    __QR_SVG__
    <p>Scan to add your photos and videos<small>They appear on this wall within a minute.</small></p>
  </div>
</footer>
<div class="hint" id="hint">Press F or click for full screen</div>

<script>
(() => {
  const CONFIG = {
    folderId: '1oWoLtRB513iH9FUlIvNsBbGylcjif09z',
    apiKey: '__API_KEY__',           // Google Cloud API key, Drive API enabled, restricted to this site
    refreshSeconds: 60,              // how often the folder is re-read
    lensEvery: 12,                   // seconds between one picture coming forward
    lensHold: 5.5,                   // seconds it stays forward
    speedMin: 7, speedMax: 12,       // drift, pixels per second per column
    tileWidth: 300                   // target column width in CSS pixels; columns = width / this
  };
  const qs = new URLSearchParams(location.search);
  const apiKey = qs.get('key') || CONFIG.apiKey;
  const demo = qs.get('demo') === '1';
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = id => document.getElementById(id);
  const river = $('river'), countEl = $('count'), empty = $('empty'), emptyLine = $('emptyLine');
  const count = { set textContent(v) { countEl.textContent = v; if (document.body.classList.contains('empty-state')) emptyLine.textContent = v; } };
  const thumb = (id, w) => 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w' + w;

  // ---------- data
  const photos = new Map(); let order = [], queue = [], seenOnce = false;
  async function listAll() {
    if (demo) return demoList();
    if (!apiKey || apiKey.startsWith('__')) { count.textContent = 'This wall needs its Drive key before it can show photos'; return null; }
    const q = `'${CONFIG.folderId}' in parents and trashed = false and (mimeType contains 'image/' or mimeType contains 'video/')`;
    const fields = 'nextPageToken,files(id,mimeType,createdTime,imageMediaMetadata(width,height,rotation),videoMediaMetadata(width,height))';
    let token = '', out = [];
    do {
      const url = 'https://www.googleapis.com/drive/v3/files?q=' + encodeURIComponent(q) + '&fields=' + encodeURIComponent(fields) + '&orderBy=createdTime%20desc&pageSize=1000&key=' + encodeURIComponent(apiKey) + (token ? '&pageToken=' + encodeURIComponent(token) : '');
      const r = await fetch(url);
      if (!r.ok) {  // a 4xx is a setup problem (key, restriction, API not enabled): say what Google said so it can be fixed
        let msg = 'Drive API ' + r.status; try { const e = await r.json(); if (e.error && e.error.message) msg += ': ' + e.error.message.slice(0, 160); } catch (_) {}
        const err = new Error(msg); err.setup = r.status >= 400 && r.status < 500; throw err;
      }
      const d = await r.json(); out = out.concat(d.files || []); token = d.nextPageToken || '';
    } while (token);
    return out.map(f => {
      const m = f.imageMediaMetadata || f.videoMediaMetadata || {}; let w = m.width || 4, h = m.height || 3;
      if (f.imageMediaMetadata && (m.rotation === 1 || m.rotation === 3)) [w, h] = [h, w];
      return { id: f.id, video: f.mimeType.startsWith('video/'), created: Date.parse(f.createdTime), ratio: h / w };
    });
  }
  function demoList() {
    const now = Date.now(), dims = [[900, 1600], [900, 1600], [900, 1600], [900, 1600], [900, 1600], [900, 1600], [900, 1600], [900, 1600], [900, 1600], [900, 1600], [900, 1600], [900, 1600]];
    return Array.from({ length: 12 }, (_, i) => ({ id: 'demo' + (i + 1), video: i === 4, created: now - i * 9e5, ratio: dims[i][1] / dims[i][0] }));
  }
  const src = (p, w) => demo ? 'demo/' + String(p.id.replace('demo', '')).padStart(2, '0') + '.jpg' : thumb(p.id, w);

  // ---------- the river: columns of tiles that drift upward and recycle
  const cols = []; let colW = 0, gapPx = 0, lastT = 0, running = false;
  function layout() {
    const n = Math.max(2, Math.min(8, Math.round(innerWidth / CONFIG.tileWidth)));
    gapPx = Math.round(Math.min(innerWidth, innerHeight) * 0.006);
    river.innerHTML = ''; cols.length = 0;
    colW = (innerWidth - gapPx * (n + 1)) / n;
    for (let i = 0; i < n; i++) {
      const el = document.createElement('div'); el.className = 'col'; river.appendChild(el);
      const speed = CONFIG.speedMin + (CONFIG.speedMax - CONFIG.speedMin) * ((i * 0.618) % 1);
      const stagger = ((i * 0.37) % 1) * innerHeight * 0.5;      // columns start at different points so the rows never line up
      cols.push({ el, tiles: [], offset: stagger, bottom: 0, speed: reduced ? 0 : speed });
    }
    if (order.length) fill();
  }
  function nextPhoto() {
    if (!queue.length) queue = order.slice();           // start again from the newest once every picture has been shown
    return photos.get(queue.shift());
  }
  function makeTile(p, col) {
    const h = Math.round(colW * Math.max(0.6, Math.min(1.75, p.ratio)));
    const t = document.createElement('div'); t.className = 'tile' + (p.video ? ' video' : '') + (p.fresh ? ' fresh' : '');
    t.style.height = h + 'px'; t.style.top = col.bottom + 'px';
    const box = document.createElement('div'); box.className = 'box';
    const img = document.createElement('img'); img.alt = ''; img.decoding = 'async'; img.src = src(p, 800);
    img.onload = () => img.classList.add('in'); img.onerror = () => { t.dataset.dead = '1'; };
    box.appendChild(img); const play = document.createElement('div'); play.className = 'play'; box.appendChild(play); t.appendChild(box);
    if (p.fresh) { const j = document.createElement('div'); j.className = 'just'; j.textContent = 'just now'; box.appendChild(j); }
    t.dataset.id = p.id; col.el.appendChild(t);
    col.tiles.push({ el: t, top: col.bottom, h, p }); col.bottom += h + gapPx;
    p.fresh = false;
  }
  function fill() {
    for (const col of cols) {
      let guard = 0;
      while (col.bottom - col.offset < innerHeight * 1.1 && guard++ < 40) makeTile(nextPhoto(), col);
    }
  }
  function tick(now) {
    const dt = Math.min(0.05, (now - (lastT || now)) / 1000); lastT = now;
    for (const col of cols) {
      col.offset += col.speed * dt;
      while (col.tiles.length && col.tiles[0].top + col.tiles[0].h < col.offset - 10) {
        const gone = col.tiles.shift(); gone.el.remove();
      }
      col.el.style.transform = 'translate3d(0,' + (-col.offset).toFixed(2) + 'px,0)';
    }
    if (order.length) fill();
    requestAnimationFrame(tick);
  }

  // ---------- the lens: one picture comes forward for a few seconds
  let lensTile = null, lensTimer = null;
  // the picture lifts out of the stream to the middle of the screen, then settles back where it was
  function candidates() {
    const out = [];
    cols.forEach((col, ci) => col.tiles.forEach(t => {
      const top = t.top - col.offset, mid = top + t.h / 2;
      if (t.el.dataset.dead || t.el.classList.contains('lens')) return;
      if (mid < innerHeight * 0.06 || mid > innerHeight * 0.94) return;
      t.ci = ci; t.vmid = mid; out.push(t);
    }));
    return out;
  }
  function lens(t) {
    if (!t) return;
    if (lensTile) { unlens(lensTile); }
    const scale = Math.min(2.2, (innerWidth * 0.55) / colW, (innerHeight * 0.7) / t.h);
    const cx = gapPx + t.ci * (colW + gapPx) + colW / 2, cy = t.vmid;
    const tx = innerWidth / 2 - cx, ty = innerHeight * 0.4 - cy;
    const box = t.el.querySelector('.box');
    box.style.transform = 'translate(' + tx.toFixed(1) + 'px,' + ty.toFixed(1) + 'px) scale(' + scale.toFixed(3) + ')';
    box.style.boxShadow = '0 0 0 .35vmin var(--cream), 0 4vmin 8vmin rgba(0,0,0,.65)';
    t.el.classList.add('lens'); t.el.parentElement.style.zIndex = '30'; lensTile = t;
    clearTimeout(lensTimer);
    lensTimer = setTimeout(() => unlens(t), CONFIG.lensHold * 1000);
  }
  function unlens(t) {
    const box = t.el.querySelector('.box'); box.style.transform = ''; box.style.boxShadow = '';
    t.el.classList.remove('fresh');
    setTimeout(() => { t.el.classList.remove('lens'); if (!t.el.parentElement.querySelector('.lens')) t.el.parentElement.style.zIndex = ''; }, 1700);   // stays above the others until it has settled back
    if (lensTile === t) lensTile = null;
  }
  function lensNext() {
    // a freshly arrived picture first, otherwise a random one from the middle of the screen
    const c = candidates(); if (!c.length) return;
    const fresh = c.find(t => t.el.classList.contains('fresh'));
    lens(fresh || c[Math.floor(Math.random() * c.length)]);
  }

  // ---------- refresh
  async function refresh() {
    try {
      const list = await listAll(); if (!list) return;
      const fresh = [];
      list.forEach(p => { if (!photos.has(p.id)) { photos.set(p.id, p); if (seenOnce) { p.fresh = true; fresh.push(p.id); } } });
      order = list.map(p => p.id); seenOnce = true;
      if (fresh.length) queue.unshift(...fresh);           // new pictures rise next
      const n = order.length;
      document.body.classList.toggle('empty-state', n === 0); empty.classList.toggle('show', n === 0);
      count.textContent = n === 0 ? 'Waiting for the first photo' : n === 1 ? 'One photo so far' : n + ' photos and videos so far';
      if (n === 0) emptyLine.textContent = 'The first photos from the celebrations will appear here.';
      if (n && !running) { running = true; fill(); requestAnimationFrame(tick); setInterval(lensNext, CONFIG.lensEvery * 1000); }
    } catch (e) { count.textContent = e.setup ? e.message : 'Cannot reach Google Drive at the moment, trying again shortly'; console.error(e); }
  }
  layout(); addEventListener('resize', () => { const keep = queue; layout(); });
  refresh(); setInterval(refresh, (Number(qs.get('refresh')) || CONFIG.refreshSeconds) * 1000);

  const hint = $('hint');
  const goFull = () => { const el = document.documentElement; if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(() => {}); hint.classList.add('gone'); };
  document.addEventListener('click', goFull);
  document.addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F') goFull(); });
  setTimeout(() => hint.classList.add('gone'), 10000);
})();
</script>
</body>
</html>
